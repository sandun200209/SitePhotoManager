spring.application.name=SitePhotoManager

# Database Configuration with Environment Variables and safe local fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/site_photo_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=${PORT:8080}