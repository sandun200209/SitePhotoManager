<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>Sign In - SitePhotoManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-badge">🏗️</div>
            <h1 class="auth-title">SitePhotoManager</h1>
            <p class="auth-subtitle">Construction & Site Photo Management</p>
        </div>

        <!-- Success Logout Message -->
        <div th:if="${logoutMessage}" class="alert alert-success" role="alert">
            <span th:text="${logoutMessage}">You have been logged out successfully.</span>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">Invalid email or password.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@sitephoto.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <!-- Quick Demo Credential Autofill (Convenient for Field Testing) -->
        <div class="demo-credentials">
            <div class="demo-title">Test Accounts (Click to Fill)</div>
            <div class="credential-chips">
                <button type="button" class="chip-btn" onclick="fillCreds('admin@sitephoto.com', 'admin123')">
                    <span class="chip-role">ADMIN</span>
                    <span class="chip-info">admin@sitephoto.com</span>
                </button>
                <button type="button" class="chip-btn" onclick="fillCreds('engineer@sitephoto.com', 'engineer123')">
                    <span class="chip-role">ENGINEER</span>
                    <span class="chip-info">engineer@sitephoto.com</span>
                </button>
                <button type="button" class="chip-btn" onclick="fillCreds('supervisor@sitephoto.com', 'supervisor123')">
                    <span class="chip-role">SUPERVISOR</span>
                    <span class="chip-info">supervisor@sitephoto.com</span>
                </button>
                <button type="button" class="chip-btn" onclick="fillCreds('viewer@sitephoto.com', 'viewer123')">
                    <span class="chip-role">VIEWER</span>
                    <span class="chip-info">viewer@sitephoto.com</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }
</script>
</body>
</html>
